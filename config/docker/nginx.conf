# Virtual Hosts Configuration for npcsolutions.co.uk

# 1. Main Homelab Portal & Hub
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portal.npcsolutions.co.uk docker.npcsolutions.co.uk localhost _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy to telemetry API if queried directly
    location /api/ {
        proxy_pass http://192.168.0.218:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 2. Subnet Traffic Telemetry Dashboard
server {
    listen 80;
    listen [::]:80;
    server_name traffic.npcsolutions.co.uk;

    location / {
        proxy_pass http://192.168.0.218:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Microsoft Business Central Server
server {
    listen 80;
    listen [::]:80;
    server_name bc.npcsolutions.co.uk;

    location / {
        proxy_pass http://192.168.0.218:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. Guacamole Web RDP Gateway
server {
    listen 80;
    listen [::]:80;
    server_name guacamole.npcsolutions.co.uk;

    location / {
        proxy_pass http://192.168.0.218:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}