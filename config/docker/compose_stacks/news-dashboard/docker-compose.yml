services:
  news-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: news-dashboard:latest
    container_name: news-dashboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - TZ=UTC
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
