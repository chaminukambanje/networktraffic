global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'telegraf'
    static_configs:
      - targets: ['telegraf:9273']

  - job_name: 'esxi_vms'
    scrape_interval: 20s
    scrape_timeout: 15s
    static_configs:
      - targets: ['esxi-exporter:9272']

  - job_name: 'network_power_monitor'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9275']
